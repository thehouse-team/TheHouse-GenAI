name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

      - name: Dependency audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit

  lock-drift:
    name: Lockfile drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Regenerate universal lockfiles and compare
        run: |
          python -m pip install --disable-pip-version-check "uv==0.13.9"
          uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.12 -o requirements.lock
          uv pip compile pyproject.toml --universal --generate-hashes --python-version 3.12 --extra dev -o requirements-dev.lock
          git diff --exit-code -- requirements.lock requirements-dev.lock

  infra:
    name: Bicep validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Lint and build Bicep (no credentials needed)
        run: |
          set -euo pipefail
          az bicep version >/dev/null 2>&1 || az bicep install
          az bicep lint --file infra/genai.bicep
          az bicep build --file infra/genai.bicep --stdout > /dev/null

  image:
    name: Image build, smoke and scan
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: thehouse-genai:ci

      - name: Container smoke
        run: |
          set -euo pipefail
          docker run -d --name genai-smoke -p 18000:8000 \
            -e GENAI_PROVIDER=fake \
            -e APP_ENV=production \
            thehouse-genai:ci
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health/ready > /dev/null 2>&1; then
              ready="$i"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "container did not become ready"
            docker logs genai-smoke
            exit 1
          fi
          echo "OK readiness responded after ${ready}s"
          body="$(curl -fsS http://127.0.0.1:18000/health/ready)"
          if [ "$body" != '{"status":"ok","service":"thehouse-genai","version":"0.1.0"}' ]; then
            echo "unexpected readiness payload: $body"
            exit 1
          fi
          echo "OK readiness payload exact"
          if curl -fsS -D - -o /dev/null http://127.0.0.1:18000/health/ready | grep -qi '^server:'; then
            echo "Server header must not be present"
            exit 1
          fi
          echo "OK no Server header"
          uid="$(docker exec genai-smoke id -u)"
          if [ "$uid" != "10001" ]; then
            echo "unexpected uid: $uid"
            exit 1
          fi
          echo "OK uid 10001"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/docs)"
          if [ "$code" != "404" ]; then
            echo "/docs must return 404, got ${code}"
            exit 1
          fi
          echo "OK /docs returns 404"
          code="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/openapi.json)"
          if [ "$code" != "404" ]; then
            echo "/openapi.json must return 404, got ${code}"
            exit 1
          fi
          echo "OK /openapi.json returns 404"
          if docker exec genai-smoke sh -c 'echo probe > /app/src/write-probe' 2>/dev/null; then
            echo "app must not be able to write to /app/src"
            exit 1
          fi
          echo "OK write denied in /app/src"
          if docker exec genai-smoke sh -c 'echo probe > /opt/venv/write-probe' 2>/dev/null; then
            echo "app must not be able to write to /opt/venv"
            exit 1
          fi
          echo "OK write denied in /opt/venv"
          echo "container smoke passed"

      - name: Stop smoke container
        if: always()
        run: docker rm -f genai-smoke || true

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: thehouse-genai:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: thehouse-genai:ci
          format: spdx-json
          output: sbom.spdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error

      - name: Save tested image for publishing
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker save thehouse-genai:ci -o image.tar

      - name: Upload tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: genai-image
          path: image.tar
          if-no-files-found: error

  publish:
    name: Publish image to GHCR
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.push.outputs.digest }}
    steps:
      - name: Download tested image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: genai-image
          path: .

      - name: Download SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sbom-spdx
          path: .

      - name: Load the exact image that passed smoke and scan
        run: docker load -i image.tar

      - name: Login to GHCR
        run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push by immutable SHA tag
        id: push
        run: |
          set -euo pipefail
          ref="ghcr.io/thehouse-team/thehouse-genai:sha-${{ github.sha }}"
          docker tag thehouse-genai:ci "${ref}"
          docker push "${ref}"
          digest="$(docker image inspect --format '{{index .RepoDigests 0}}' "${ref}" | sed 's/^.*@//')"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"
          echo "**Image:** \`${ref}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "**Digest:** \`${digest}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/thehouse-team/thehouse-genai
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false

      - name: Attest SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ghcr.io/thehouse-team/thehouse-genai
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
