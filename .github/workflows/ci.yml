name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-dev.lock
          pip install --no-deps -e .

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src

      - name: Pytest
        run: pytest

      - name: Dependency audit
        continue-on-error: true
        run: |
          python -m pip install pip-audit
          pip-audit

  lock-drift:
    name: Lockfile drift
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.lock

      - name: Regenerate lockfiles and compare
        run: |
          python -m pip install --upgrade pip
          python -m pip install --disable-pip-version-check "pip-tools==7.7.0"
          python -m piptools compile --generate-hashes --no-strip-extras --output-file requirements.lock pyproject.toml
          python -m piptools compile --generate-hashes --no-strip-extras --extra dev --output-file requirements-dev.lock pyproject.toml
          git diff --exit-code -- requirements.lock requirements-dev.lock

  image:
    name: Image build, smoke and scan
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image without publishing
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: thehouse-genai:ci

      - name: Container smoke
        run: |
          set -euo pipefail
          docker run -d --name genai-smoke -p 18000:8000 \
            -e GENAI_PROVIDER=fake \
            -e APP_ENV=production \
            thehouse-genai:ci
          ready=""
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18000/health/ready > /dev/null 2>&1; then
              ready="$i"
              break
            fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "container did not become ready"
            docker logs genai-smoke
            exit 1
          fi
          body="$(curl -fsS http://127.0.0.1:18000/health/ready)"
          if [ "$body" != '{"status":"ok","service":"thehouse-genai","version":"0.1.0"}' ]; then
            echo "unexpected readiness payload: $body"
            exit 1
          fi
          if curl -fsS -D - -o /dev/null http://127.0.0.1:18000/health/ready | grep -qi '^server:'; then
            echo "Server header must not be present"
            exit 1
          fi
          uid="$(docker exec genai-smoke id -u)"
          if [ "$uid" != "10001" ]; then
            echo "unexpected uid: $uid"
            exit 1
          fi
          for path in /docs /openapi.json; do
            code="$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18000${path}")"
            if [ "$code" != "404" ]; then
              echo "${path} must return 404, got ${code}"
              exit 1
            fi
          done
          for path in /app/src /opt/venv; do
            if docker exec genai-smoke sh -c "echo probe > ${path}/write-probe" 2>/dev/null; then
              echo "app must not be able to write to ${path}"
              exit 1
            fi
          done
          echo "container smoke passed"

      - name: Stop smoke container
        if: always()
        run: docker rm -f genai-smoke || true

      - name: Vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: thehouse-genai:ci
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          trivyignores: .trivyignore

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: thehouse-genai:ci
          format: spdx-json
          output: sbom.spdx.json
          exit-code: "0"

      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-spdx
          path: sbom.spdx.json
          if-no-files-found: error
