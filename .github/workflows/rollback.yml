name: Rollback GenAI deployment

on:
  workflow_dispatch:
    inputs:
      image_digest:
        description: 'Previous good image: ghcr.io/thehouse-team/thehouse-genai@sha256:<64 hex>'
        required: true
        type: string

permissions:
  contents: read

jobs:
  rollback:
    name: Redeploy previous digest in production
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      # workflow_dispatch runs on the ref chosen by the operator (usually main), so the
      # default checkout gives the parser from that same ref. No credentials persisted.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Azure login via OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Validate the requested image reference
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          if ! [[ "$IMAGE_REF" =~ ^ghcr\.io/thehouse-team/thehouse-genai@sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid image reference: expected ghcr.io/thehouse-team/thehouse-genai@sha256:<64 hex>"
            exit 1
          fi
          echo "**Rollback image:** \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Redeploy the validated digest
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          app="${{ vars.AZURE_CONTAINER_APP }}"
          group="${{ vars.AZURE_RESOURCE_GROUP }}"
          previous="$(az containerapp show --name "$app" --resource-group "$group" \
            --query properties.template.containers[0].image -o tsv)"

          if [[ "$previous" == "$IMAGE_REF" ]]; then
            echo "Requested image is already the active image; nothing to roll back."
            exit 1
          fi

          az containerapp update --name "$app" --resource-group "$group" --image "$IMAGE_REF"
          echo "**Previous image (before rollback):** \`${previous}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Wait for the new revision and verify the active digest
        shell: bash
        env:
          IMAGE_REF: ${{ inputs.image_digest }}
        run: |
          set -euo pipefail
          app="${{ vars.AZURE_CONTAINER_APP }}"
          group="${{ vars.AZURE_RESOURCE_GROUP }}"
          attempts=24
          sleep_seconds=10
          last_state=""
          revision="$(az containerapp show --name "$app" --resource-group "$group" \
            --query properties.latestRevisionName -o tsv)"

          for attempt in $(seq 1 "$attempts"); do
            # JSON, never a multi-select -o tsv: knack prints one line per field.
            az containerapp revision show --name "$app" --resource-group "$group" \
              --revision "$revision" -o json > revision.json
            echo "attempt ${attempt}/${attempts}"
            rc=0
            output="$(python3 .github/ci/revision_status.py revision.json --expected "$IMAGE_REF" 2>&1)" || rc=$?
            echo "$output"
            last_state="$(printf '%s\n' "$output" | grep -m1 '^revision=' || true)"
            if [[ "$rc" -eq 0 ]]; then
              echo "VERIFIED revision=${revision} image=${IMAGE_REF}"
              echo "**Revision:** \`${revision}\`" >> "$GITHUB_STEP_SUMMARY"
              echo "**Verified image:** \`${IMAGE_REF}\`" >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            if [[ "$rc" -eq 2 ]]; then
              echo "Fatal revision state or invalid payload; aborting without rollback."
              exit 1
            fi
            sleep "$sleep_seconds"
          done

          echo "Rollback verification failed after ${attempts} attempts."
          echo "Last parsed state: ${last_state}"
          exit 1
